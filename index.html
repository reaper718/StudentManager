<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Manager</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Main Container -->
    <div class="container py-5">

        <!-- Heading -->
        <div class="text-center mb-4">
            <h1 class="fw-bold">Student Manager</h1>
            <p class="text-muted">All Students: <span class="student-count">0</span></p>
        </div>


        <!-- Expense Form Card -->
        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <h4 class="card-title mb-4">Add Student</h4>

                <form onsubmit="handleFormSubmit(event)">

                    <div class="row g-3">

                        <!-- Expense -->
                        <div class="col-md-4">

                            <label for="name" class="form-label">
                                Name
                            </label>

                            <div class="input-group">

                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter name"
                                    required
                                >
                            </div>

                        </div>


                        <!-- Description -->
                        <div class="col-md-4">

                            <label for="description" class="form-label">
                                Phone Number:
                            </label>

                            <input
                                type="number"
                                id="phone"
                                name="phone"
                                class="form-control"
                                placeholder="+91 9293XXXXX0"
                                required
                            >

                        </div>


                        <!-- Category -->
                        <div class="col-md-4">

                            <label for="category" class="form-label">
                                Address
                            </label>

                            <input 
                                type="text"
                                id="address"
                                name="address"
                                class="form-select"
                                required
                            >

                        </div>

                    </div>


                    <!-- Submit Button -->
                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Add Student
                        </button>

                    </div>

                </form>

            </div>

        </div>


        <div class="card shadow-sm">

            <div class="card-body">

                <h4 class="card-title mb-4">
                    All Students
                </h4>

                <!-- Your JavaScript will add <li> elements here -->
                <ul class="list-group" id="studentList"></ul>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>

    <!-- Your JavaScript -->
    <script src="index.js"></script>

</body>

</html>
